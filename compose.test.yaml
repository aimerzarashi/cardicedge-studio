# make test 用の使い捨て環境。プロジェクト名 studio-test で起動し、終了後に破棄する。
# 開発用の環境（compose.yaml）とはコンテナ・ネットワーク・DB が別で、ホストにポートも公開しないため同時に動かせる
services:
  # 使い捨ての core と DB。studio が前提にする版（Makefile の CORE_VERSION）のリリース済みのイメージを使う（studio#14）。
  # ../core のソースからビルドしないのは、手元の ../core のブランチしだいで、前提と違う core でテストしうるため
  core:
    image: diecardomain/core:${CORE_VERSION:?make test から CORE_VERSION を渡す}
    environment:
      # core は studio 用・game 用の DB を分けて使う（core#33）
      STUDIO_DB_DSN: "host=core-db port=5432 user=core_user password=core_password dbname=core_studio sslmode=disable"
      GAME_DB_DSN: "host=core-db port=5432 user=core_user password=core_password dbname=core_game sslmode=disable"
      # JWKS は studio-envoy を通して取る（studio#11: studio には envoy を通してしか届かない）。iss・aud は studio の JWT_ISSUER・JWT_AUDIENCE と一致させる
      STUDIO_JWKS_URL: http://studio-envoy:10000/api/auth/jwks
      STUDIO_JWT_ISSUER: diecardomain-studio
      STUDIO_JWT_AUDIENCE: diecardomain-core
      # game の JWT（core で必須。core#34）。studio のテストでは game を起動しないため JWKS には届かないが、core は届かなくても
      # 起動する（最初の JWT が来たときに取りに行く）
      GAME_JWKS_URL: http://game-envoy:10000/api/auth/jwks
      GAME_JWT_ISSUER: diecardomain-game
      GAME_JWT_AUDIENCE: diecardomain-core
      # seed のオペレーター（scripts/seed.ts）と同じアドレス。ログインして core を呼ぶと紐づく
      STUDIO_INITIAL_OPERATOR_EMAIL: operator@example.com
    healthcheck:
      test: ["CMD", "/app", "healthcheck"]
      start_period: 30s
      start_interval: 1s
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      core-migrate-studio:
        condition: service_completed_successfully
      core-migrate-game:
        condition: service_completed_successfully

  # studio 用・game 用の DB に、同じマイグレーションを流す（core#33。前提の版の core では core_game は使われない）
  core-migrate-studio:
    image: diecardomain/core-migrate:${CORE_VERSION:?make test から CORE_VERSION を渡す}
    environment:
      DATABASE_URL: "postgres://core_user:core_password@core-db:5432/core_studio?sslmode=disable"
    depends_on:
      core-db:
        condition: service_healthy

  core-migrate-game:
    image: diecardomain/core-migrate:${CORE_VERSION:?make test から CORE_VERSION を渡す}
    environment:
      DATABASE_URL: "postgres://core_user:core_password@core-db:5432/core_game?sslmode=disable"
    depends_on:
      core-db:
        condition: service_healthy

  core-db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: core_user
      POSTGRES_PASSWORD: core_password
      POSTGRES_DB: core_studio
    volumes:
      - ./local/core-db:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U core_user -d core_studio"]
      interval: 2s
      timeout: 5s
      retries: 30

  # 本番用イメージ（.build/Dockerfile）の studio
  studio:
    build:
      context: .
      dockerfile: .build/Dockerfile
    environment: &studio-auth-env
      DATABASE_URL: postgres://studio_user:studio_password@studio-db:5432/studio
      BETTER_AUTH_SECRET: test-only-better-auth-secret-0123456789abcdef
      # Playwright のブラウザから見た studio の URL（studio-envoy 経由）
      BETTER_AUTH_URL: http://studio-envoy:10000
      # Playwright は中継役用の入口（10001）から入るため、そのオリジンも受け付ける
      BETTER_AUTH_TRUSTED_ORIGINS: http://studio-envoy:10001
      JWT_ISSUER: diecardomain-studio
      JWT_AUDIENCE: diecardomain-core
      CORE_GRAPHQL_URL: http://studio-envoy:10000/studio/graphql
      SMTP_URL: smtp://studio-mailpit:1025
      MAIL_FROM: diecardomain studio <no-reply@diecardomain.example>
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/favicon.ico').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      start_period: 60s
      start_interval: 1s
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      core:
        condition: service_healthy
      studio-migrate:
        condition: service_completed_successfully

  # マイグレーション用イメージで migrations を適用する
  studio-migrate:
    build:
      context: .
      dockerfile: local/migrate/Dockerfile
    environment:
      DATABASE_URL: "postgres://studio_user:studio_password@studio-db:5432/studio?sslmode=disable"
    depends_on:
      studio-db:
        condition: service_healthy

  # 送ったメールを受け止める（Playwright のテストが API で読む）
  studio-mailpit:
    image: axllent/mailpit:v1.31.4

  # better-auth のデータ。データは一時領域に置き、終了とともに破棄する
  studio-db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: studio_user
      POSTGRES_PASSWORD: studio_password
      POSTGRES_DB: studio
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio_user -d studio"]
      interval: 2s
      timeout: 5s
      retries: 30

  # 開発用と同じ入口（10000）に、テスト用の環境だけの中継役用の入口（10001。relay-listener.yaml）を重ねる
  studio-envoy:
    image: envoyproxy/envoy:v1.39.2
    command: ["sh", "-c", "exec envoy -c /etc/envoy/envoy.yaml --config-yaml \"$$(cat /etc/envoy/relay-listener.yaml)\""]
    volumes:
      - ./local/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./local/envoy/relay-listener.yaml:/etc/envoy/relay-listener.yaml:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9901 && printf 'GET /ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q LIVE <&3"]
      start_period: 30s
      start_interval: 1s
      interval: 10s
      timeout: 5s
      retries: 3

  studio-playwright:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    init: true
    user: pwuser
    working_dir: /home/pwuser
    # Playwright は studio の node_modules（package.json の @playwright/test）のものを使う。npx で起動のたびに npm から
    # 取ってくると、npm に届かないときにサーバーが立たず、版も package.json と二重に書くことになるため（studio#25）。
    # node_modules/.bin/playwright は pnpm がホストのパスを書いたスクリプトなので使わず、cli.js を node で起動する
    volumes:
      - ./node_modules:/home/pwuser/node_modules:ro
    command: ["node", "node_modules/@playwright/test/cli.js", "run-server", "--port", "3000", "--host", "0.0.0.0"]
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(3000,'localhost').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      start_period: 120s
      start_interval: 1s
      interval: 10s
      timeout: 5s
      retries: 3

  # テストの実行役。開発用イメージでソース（tests/・playwright.config.ts・node_modules）を使う。
  # make test から docker compose run で起動する
  studio-test-runner:
    build:
      context: .
      dockerfile: local/studio/Dockerfile
    profiles: ["runner"]
    init: true
    volumes:
      - ./:/home/node/app
    environment:
      <<: *studio-auth-env
      PLAYWRIGHT_WS_ENDPOINT: ws://studio-playwright:3000/
      # テストごとに X-Forwarded-For で IP を名乗るため、中継役用の入口を通す（tests/fixtures.ts）
      PLAYWRIGHT_BASE_URL: http://studio-envoy:10001
      # 公開の入口（偽装できないことを確かめるテストが使う）
      PLAYWRIGHT_PUBLIC_URL: http://studio-envoy:10000
      # 中継役用の入口（名乗った IP が記録されることを確かめるテストが使う）
      PLAYWRIGHT_RELAY_URL: http://studio-envoy:10001
      PLAYWRIGHT_MAILPIT_URL: http://studio-mailpit:8025
    # テスト用の管理者を seed で作ってからテストする（テーブルは studio-migrate が作る）
    command: ["sh", "-c", "pnpm install --frozen-lockfile && pnpm db:seed && pnpm test"]
