# make test 用の使い捨て環境。プロジェクト名 cms-test で起動し、終了後に破棄する。
# 開発用の環境（compose.yaml）とはコンテナ・ネットワーク・DB が別で、ホストにポートも公開しないため同時に動かせる
include:
  # 使い捨ての core と DB（core の本番用イメージ）
  - ../core/compose.test.yaml

services:
  # 本番用イメージ（.build/Dockerfile）の cms
  cms:
    build:
      context: .
      dockerfile: .build/Dockerfile
    environment: &cms-auth-env
      DATABASE_URL: postgres://cms_user:cms_password@cms-db:5432/cms
      BETTER_AUTH_SECRET: test-only-better-auth-secret-0123456789abcdef
      # Playwright のブラウザから見た cms の URL（cms-envoy 経由）
      BETTER_AUTH_URL: http://cms-envoy:10000
      JWT_ISSUER: diecardomain-cms
      JWT_AUDIENCE: diecardomain-core
      INITIAL_ADMIN_EMAIL: admin@example.com
      INITIAL_ADMIN_NAME: 管理者
      SMTP_URL: smtp://cms-mailpit:1025
      MAIL_FROM: diecardomain cms <no-reply@diecardomain.example>
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/favicon.ico').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      start_period: 60s
      start_interval: 1s
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      core:
        condition: service_healthy
      cms-migrate:
        condition: service_completed_successfully

  # マイグレーション用イメージで migrations を適用する
  cms-migrate:
    build:
      context: .
      dockerfile: local/migrate/Dockerfile
    environment:
      DATABASE_URL: "postgres://cms_user:cms_password@cms-db:5432/cms?sslmode=disable"
    depends_on:
      cms-db:
        condition: service_healthy

  # 送ったメールを受け止める（Playwright のテストが API で読む）
  cms-mailpit:
    image: axllent/mailpit:v1.31.4

  # better-auth のデータ。データは一時領域に置き、終了とともに破棄する
  cms-db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: cms_user
      POSTGRES_PASSWORD: cms_password
      POSTGRES_DB: cms
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cms_user -d cms"]
      interval: 2s
      timeout: 5s
      retries: 30

  cms-envoy:
    image: envoyproxy/envoy:v1.39.2
    volumes:
      - ./local/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9901 && printf 'GET /ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q LIVE <&3"]
      start_period: 30s
      start_interval: 1s
      interval: 10s
      timeout: 5s
      retries: 3

  cms-playwright:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    init: true
    user: pwuser
    working_dir: /home/pwuser
    command: ["npx", "-y", "playwright@1.63.0", "run-server", "--port", "3000", "--host", "0.0.0.0"]
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(3000,'localhost').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      start_period: 120s
      start_interval: 1s
      interval: 10s
      timeout: 5s
      retries: 3

  # テストの実行役。開発用イメージでソース（tests/・playwright.config.ts・node_modules）を使う。
  # make test から docker compose run で起動する
  cms-test-runner:
    build:
      context: .
      dockerfile: local/cms/Dockerfile
    profiles: ["runner"]
    init: true
    volumes:
      - ./:/home/node/app
    environment:
      <<: *cms-auth-env
      PLAYWRIGHT_WS_ENDPOINT: ws://cms-playwright:3000/
      PLAYWRIGHT_BASE_URL: http://cms-envoy:10000
      PLAYWRIGHT_MAILPIT_URL: http://cms-mailpit:8025
    # テスト用の管理者を seed で作ってからテストする（テーブルは cms-migrate が作る）
    command: ["sh", "-c", "pnpm install --frozen-lockfile && pnpm db:seed && pnpm test"]
