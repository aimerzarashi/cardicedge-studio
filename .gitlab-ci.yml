# MR・main への push・タグでだけ実行する（同じ変更で二重に走らせない）
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - test
  - build
  - release
  - deploy

variables:
  DOCKER_VERSION: "29.8.2"
  # local/cms/Dockerfile・.build/Dockerfile・package.json の packageManager と揃える
  PNPM_VERSION: "12.9.1"
  # Docker Hub の配布先（タグのパイプラインで push する）
  DOCKERHUB_IMAGE: diecardomain/cms
  DOCKERHUB_MIGRATE_IMAGE: diecardomain/cms-migrate
  # local/migrate/Dockerfile の FROM と揃える
  ATLAS_VERSION: "1.3.3"

# lint は MR と main で実行する（タグのパイプラインでは実行しない）
.on-mr-and-main:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# イメージのビルドに使う Docker in Docker
.docker:
  image: docker:${DOCKER_VERSION}
  services:
    - docker:${DOCKER_VERSION}-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"

# pnpm と依存パッケージのインストール（lint / test 共通）
.pnpm:
  image: node:24.21.0-bookworm
  variables:
    PNPM_HOME: /root/.local/share/pnpm
  before_script:
    - curl -fsSL https://get.pnpm.io/install.sh | env PNPM_VERSION=$PNPM_VERSION SHELL=bash sh -
    - export PATH="$PNPM_HOME/bin:$PATH"
    - pnpm install --frozen-lockfile

# make lint と同じ（biome check、型チェック、migrations の検査）
lint:
  stage: test
  extends: [.on-mr-and-main, .pnpm]
  variables:
    # 分岐点のコミットとの差分をとるため、全履歴を取得する（浅い clone だと分岐点が無いことがある）
    GIT_DEPTH: 0
  script:
    - pnpm lint
    - pnpm typecheck
    # 適用済みのマイグレーションの変更・削除・改名も検査する。比較元は MR では対象ブランチとの分岐点、
    # main では push 前の先頭（Maintainer が MR を経ずに直接 push した場合も検出するため）
    - |
      base=${CI_MERGE_REQUEST_DIFF_BASE_SHA:-$CI_COMMIT_BEFORE_SHA}
      if [ "$base" = "0000000000000000000000000000000000000000" ]; then base=""; fi
      scripts/check-migrations.sh $base

# migrations を空の DB に Atlas で適用し、better-auth の設定（lib/auth.ts）とスキーマに差分が無いことを確かめる。
# Playwright のテストは CI では未実行（make test でローカルで確かめる）
test:
  stage: test
  extends: [.on-mr-and-main, .pnpm]
  services:
    - name: postgres:18.6
      alias: cms-db
  variables:
    POSTGRES_USER: cms_user
    POSTGRES_PASSWORD: cms_password
    POSTGRES_DB: cms
    DATABASE_URL: postgres://cms_user:cms_password@cms-db:5432/cms
    # lib/auth.ts は読み込み時に必須の環境変数を確かめるため、CI 用の値を渡す（DB の差分をとるだけで使わない）
    BETTER_AUTH_SECRET: ci-only-better-auth-secret-0123456789abcdef
    BETTER_AUTH_URL: http://localhost:3000
    JWT_ISSUER: diecardomain-cms
    JWT_AUDIENCE: diecardomain-core
  script:
    - curl -sSfL -o /usr/local/bin/atlas "https://release.ariga.io/atlas/atlas-community-linux-amd64-v${ATLAS_VERSION}"
    - chmod +x /usr/local/bin/atlas
    - atlas migrate apply --dir file://migrations --url "$DATABASE_URL?sslmode=disable"
    - scripts/check-auth-schema.sh

# MR の確認用イメージ（手動）。アプリとマイグレーション用イメージを GitLab Container Registry に mr-<MR番号> で push する
build-mr:
  stage: build
  extends: .docker
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
  # lint・test（migrations の検査を含む）が通らないうちは、確認用イメージも作らせない
  needs: [lint, test]
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - IMAGE="$CI_REGISTRY_IMAGE:mr-$CI_MERGE_REQUEST_IID"
    - docker build --pull --build-arg BUILD_VERSION="mr-$CI_MERGE_REQUEST_IID" -t "$IMAGE" -f .build/Dockerfile .
    - docker push "$IMAGE"
    # マイグレーション用イメージ
    - MIGRATE_IMAGE="$CI_REGISTRY_IMAGE/migrate:mr-$CI_MERGE_REQUEST_IID"
    - docker build --pull -t "$MIGRATE_IMAGE" -f local/migrate/Dockerfile .
    - docker push "$MIGRATE_IMAGE"
  after_script:
    - docker logout "$CI_REGISTRY"

# main へのマージで semantic-release を実行し、タグ（v*）と GitLab リリースを作る。
# リリース対象のコミット（feat / fix 等）が無ければ何もしない。CHANGELOG.md は保存しない
release:
  stage: release
  image: node:24.21.0-bookworm
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    # 前回のリリースタグからの履歴を読むため、全履歴を取得する
    GIT_DEPTH: 0
  script:
    - npm install --prefix /tmp/semantic-release --no-save --no-audit --no-fund
      semantic-release@25.0.9
      @semantic-release/commit-analyzer@13.0.1
      @semantic-release/release-notes-generator@14.1.1
      @semantic-release/gitlab@13.3.3
    - /tmp/semantic-release/node_modules/.bin/semantic-release

# semantic-release が作ったタグのパイプラインで、そのタグのアプリとマイグレーション用イメージを Docker Hub に配布する
deploy:
  stage: deploy
  extends: .docker
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
    - docker build --pull --build-arg BUILD_VERSION="$CI_COMMIT_TAG" -t "$DOCKERHUB_IMAGE:$CI_COMMIT_TAG" -t "$DOCKERHUB_IMAGE:latest" -f .build/Dockerfile .
    - docker push "$DOCKERHUB_IMAGE:$CI_COMMIT_TAG"
    - docker push "$DOCKERHUB_IMAGE:latest"
    # マイグレーション用イメージ（アプリと同じタグ。本番ではアプリより先にジョブとして実行する）
    - docker build --pull -t "$DOCKERHUB_MIGRATE_IMAGE:$CI_COMMIT_TAG" -t "$DOCKERHUB_MIGRATE_IMAGE:latest" -f local/migrate/Dockerfile .
    - docker push "$DOCKERHUB_MIGRATE_IMAGE:$CI_COMMIT_TAG"
    - docker push "$DOCKERHUB_MIGRATE_IMAGE:latest"
  after_script:
    - docker logout
