# テスト用の環境（compose.test.yaml）にだけ足す、中継役用の入口（envoy の --config-yaml で envoy.yaml に重ねる）。
# X-Forwarded-For の最後の 1 段を利用者の IP として信じるので、Playwright がテストごとに別の IP を名乗れる
# （本番モードのレート制限はログインを同じ IP から 10 秒に 3 回までにするため）。
# 届いた X-Forwarded-For をそのまま信じる入口なので、開発用・リリース版の環境には置かず、ポートも公開しない（cms#10）
static_resources:
  listeners:
    - name: listener_relay
      address:
        socket_address: { address: 0.0.0.0, port_value: 10001 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_relay
                use_remote_address: true
                xff_num_trusted_hops: 1
                route_config:
                  name: relay_route
                  request_headers_to_add:
                    - header: { key: x-client-ip, value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%" }
                      append_action: OVERWRITE_IF_EXISTS_OR_ADD
                  virtual_hosts:
                    - name: backend
                      domains: ["*"]
                      # テストは cms だけを使うため、core（/cms/graphql）への経路は置かない
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: cms }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
