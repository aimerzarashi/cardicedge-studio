services:
  cms:
    build:
      context: .
      dockerfile: local/cms/Dockerfile
    init: true
    volumes:
      # node_modules もホストと共有し、ホストの VSCode（型補完・biome）から使えるようにする
      - ./:/home/node/app
      # pnpm のキャッシュ（メタデータ・パッケージ）。down しても残す
      - node-cache:/home/node/.cache
    # ホストには公開せず、cms-envoy 経由でアクセスする
    # 開発用オペレーターの seed（冪等）を済ませてから開発サーバーを起動する。テーブルは cms-migrate が先に作る
    command: ["sh", "-c", "pnpm install --frozen-lockfile && pnpm db:seed && exec pnpm dev --hostname 0.0.0.0"]
    environment:
      DATABASE_URL: postgres://cms_user:cms_password@cms-db:5432/cms
      # 開発用の固定値（本番では環境ごとに安全な値を渡す）
      BETTER_AUTH_SECRET: dev-only-better-auth-secret-change-me-0123456789
      # ブラウザから見た cms の URL（cms-envoy 経由）
      BETTER_AUTH_URL: http://localhost:${CMS_PORT:-3001}
      # JWT の iss / aud。core の設定と一致させる。iss は core がオペレーターを識別するキーの一部のため、運用開始後は変えない
      JWT_ISSUER: diecardomain-cms
      JWT_AUDIENCE: diecardomain-core
      # 最初の管理者（パスワード無し。「パスワードを忘れた」で設定する）。管理者が 1 人もいないときだけ作る
      INITIAL_ADMIN_EMAIL: admin@example.com
      INITIAL_ADMIN_NAME: 管理者
      # メールは Mailpit が受け止める（http://localhost:8025 で読める）
      SMTP_URL: smtp://cms-mailpit:1025
      MAIL_FROM: diecardomain cms <no-reply@diecardomain.example>
      # Playwright のブラウザ（別コンテナ）は cms-envoy 経由、make tunnel は Quick Tunnel 経由でアクセスする
      BETTER_AUTH_TRUSTED_ORIGINS: http://cms-envoy:10000,https://*.trycloudflare.com
      # Playwright はブラウザを cms-playwright コンテナで動かし、cms-envoy 経由でアクセスする
      PLAYWRIGHT_WS_ENDPOINT: ws://cms-playwright:3000/
      PLAYWRIGHT_BASE_URL: http://cms-envoy:10000
      # 開発用の環境には中継役用の入口が無いため、公開の入口と同じ（レート制限も開発モードでは無効）
      PLAYWRIGHT_PUBLIC_URL: http://cms-envoy:10000
      # Playwright のテストが、届いたメールを Mailpit の API で読む
      PLAYWRIGHT_MAILPIT_URL: http://cms-mailpit:8025
    # 共有ネットワーク（diecardomain）には参加しない。参加すると core・game から envoy を通らずに直接届き、
    # x-client-ip を自由に付けてレート制限をすり抜けられる（cms#11）。core を呼ぶときは cms-envoy の /cms/graphql を通す
    depends_on:
      cms-migrate:
        condition: service_completed_successfully
    # make up (--wait) はこれが healthy になるまで待つ
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/favicon.ico').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      start_period: 120s
      start_interval: 1s
      interval: 10s
      timeout: 5s
      retries: 3

  # 未適用のマイグレーションを Atlas で適用して終了する（cms の起動前に1回実行する。make migrate でも実行できる）
  cms-migrate:
    build:
      context: .
      dockerfile: local/migrate/Dockerfile
    # 開発中はリポジトリの migrations をそのまま使う（make migrate-hash で atlas.sum も書き換えるため読み書き可）
    volumes:
      - ./migrations:/migrations
    environment:
      DATABASE_URL: "postgres://cms_user:cms_password@cms-db:5432/cms?sslmode=disable"
    depends_on:
      cms-db:
        condition: service_healthy

  # 送ったメールを受け止める（外には送らない）。ホストから http://localhost:8025 で読む。衝突する場合は CMS_MAILPIT_PORT で変更する
  cms-mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - ${CMS_MAILPIT_PORT:-8025}:8025

  # better-auth のデータ（オペレーター・セッション等）。ゲームのデータは core-db に置く
  cms-db:
    image: postgres:18.6
    # ホストの SQLTools 等から接続するため公開する（5432 は core-db が使う）。衝突する場合は CMS_DB_PORT で変更する
    ports:
      - ${CMS_DB_PORT:-5433}:5432
    environment:
      POSTGRES_USER: cms_user
      POSTGRES_PASSWORD: cms_password
      POSTGRES_DB: cms
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cms_user -d cms"]
      interval: 2s
      timeout: 5s
      retries: 30

  # 開発環境の入口。他プロジェクトと衝突する場合は CMS_PORT で変更する
  cms-envoy:
    image: envoyproxy/envoy:v1.39.2
    ports:
      - ${CMS_PORT:-3001}:10000
    volumes:
      - ./local/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    depends_on:
      - cms
    # /cms/graphql を core:3333 に転送し、core から cms（JWKS 等）にもここを通って届くよう、共有ネットワークにも参加する
    networks:
      - default
      - diecardomain
    # イメージに curl が無いため bash の /dev/tcp で admin の /ready を確認する（HTTP/1.0 は 426 になる）
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9901 && printf 'GET /ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q LIVE <&3"]
      start_period: 30s
      start_interval: 1s
      interval: 10s
      timeout: 5s
      retries: 3

  # オプション: Cloudflare Quick Tunnel で外部（スマホ等）からアクセスする。make tunnel で起動
  cms-tunnel:
    image: cloudflare/cloudflared:2026.9.3
    profiles: ["tunnel"]
    command: ["tunnel", "--no-autoupdate", "--url", "http://cms-envoy:10000"]
    depends_on:
      cms-envoy:
        condition: service_healthy

  # ブラウザ入りの公式イメージ。@playwright/test とバージョンを一致させる
  cms-playwright:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    init: true
    user: pwuser
    working_dir: /home/pwuser
    command: ["npx", "-y", "playwright@1.63.0", "run-server", "--port", "3000", "--host", "0.0.0.0"]
    # make up (--wait) で、サーバーが接続を受け付けるまで待つ
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(3000,'localhost').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      start_period: 120s
      start_interval: 1s
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  node-cache:

# core / game と共有するネットワーク（core の make up で作成される）。cms 側は cms-envoy だけが参加する
networks:
  diecardomain:
    external: true
