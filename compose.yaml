services:
  studio:
    build:
      context: .
      dockerfile: local/studio/Dockerfile
    init: true
    volumes:
      # node_modules もホストと共有し、ホストの VSCode（型補完・biome）から使えるようにする
      - ./:/home/node/app
      # pnpm のキャッシュ（メタデータ・パッケージ）。down しても残す
      - node-cache:/home/node/.cache
    # ホストには公開せず、studio-envoy 経由でアクセスする
    # 開発用オペレーターの seed（冪等）を済ませてから開発サーバーを起動する。テーブルは studio-migrate が先に作る
    command:
      [
        "sh",
        "-c",
        "pnpm install --frozen-lockfile && pnpm db:seed && exec pnpm dev --hostname 0.0.0.0",
      ]
    environment:
      DATABASE_URL: postgres://studio_user:studio_password@studio-db:5432/studio
      # 開発用の固定値（本番では環境ごとに安全な値を渡す）
      BETTER_AUTH_SECRET: dev-only-better-auth-secret-change-me-0123456789
      # ブラウザから見た studio の URL（studio-envoy 経由）
      BETTER_AUTH_URL: http://localhost:${STUDIO_PORT:-3001}
      # JWT の iss / aud。core の設定と一致させる。iss は core がオペレーターを識別するキーの一部のため、運用開始後は変えない
      JWT_ISSUER: diecardomain-studio
      JWT_AUDIENCE: diecardomain-core
      # core の GraphQL。studio は共有ネットワークに参加しないため、studio-envoy を通す（studio#11）
      CORE_GRAPHQL_URL: http://studio-envoy:10000/studio/graphql
      # メールは Mailpit が受け止める（http://localhost:8025 で読める）
      SMTP_URL: smtp://studio-mailpit:1025
      MAIL_FROM: diecardomain studio <no-reply@diecardomain.example>
      # Playwright のブラウザ（別コンテナ）は studio-envoy 経由、make tunnel は Quick Tunnel 経由でアクセスする
      BETTER_AUTH_TRUSTED_ORIGINS: http://studio-envoy:10000,https://*.trycloudflare.com
      # Playwright はブラウザを studio-playwright コンテナで動かし、studio-envoy 経由でアクセスする
      PLAYWRIGHT_WS_ENDPOINT: ws://studio-playwright:3000/
      PLAYWRIGHT_BASE_URL: http://studio-envoy:10000
      # 開発用の環境には中継役用の入口が無いため、公開の入口と同じ（レート制限も開発モードでは無効）
      PLAYWRIGHT_PUBLIC_URL: http://studio-envoy:10000
      # Playwright のテストが、届いたメールを Mailpit の API で読む
      PLAYWRIGHT_MAILPIT_URL: http://studio-mailpit:8025
      # トレースの送り先（OpenTelemetry の標準の環境変数。studio#50）。受け手（core の compose の otel-lgtm）が止まっていても studio は普通に動く
      OTEL_EXPORTER_OTLP_ENDPOINT: http://host.docker.internal:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: studio
    # 共有ネットワークには入れず、ホストの口（otel-lgtm）へ届ける。理由は core の compose の otel-lgtm の注記（core#74）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 共有ネットワーク（diecardomain-studio）には参加しない。参加すると core・game から envoy を通らずに直接届き、
    # x-client-ip を自由に付けてレート制限をすり抜けられる（studio#11）。core を呼ぶときは studio-envoy の /studio/graphql を通す
    depends_on:
      studio-migrate:
        condition: service_completed_successfully
    # make up (--wait) はこれが healthy になるまで待つ
    # 起動の確かめで better-auth の入口（/api/auth/ok）を読み、その部品を先に読み込ませる。固定のファイル（favicon.ico）だと、最初の
    # ログインのときに読み込みが重なって遅くなり、テストが表示を待つ上限（5 秒）を超えて落ちたことがあるため（studio#57）
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/auth/ok').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      start_period: 120s
      start_interval: 1s
      interval: 10s
      timeout: 5s
      retries: 3

  # 未適用のマイグレーションを Atlas で適用して終了する（studio の起動前に1回実行する。make migrate でも実行できる）
  studio-migrate:
    build:
      context: .
      dockerfile: local/migrate/Dockerfile
    # 開発中はリポジトリの migrations をそのまま使う（make migrate-hash で atlas.sum も書き換えるため読み書き可）
    volumes:
      - ./migrations:/migrations
    environment:
      DATABASE_URL: "postgres://studio_user:studio_password@studio-db:5432/studio?sslmode=disable"
    depends_on:
      studio-db:
        condition: service_healthy

  # 送ったメールを受け止める（外には送らない）。ホストから http://localhost:8025 で読む。衝突する場合は STUDIO_MAILPIT_PORT で変更する
  studio-mailpit:
    image: axllent/mailpit:v1.33.0
    ports:
      - ${STUDIO_MAILPIT_PORT:-8025}:8025

  # better-auth のデータ（オペレーター・セッション等）。ゲームのデータは core-db に置く
  studio-db:
    image: postgres:18.6
    # ホストの SQLTools 等から接続するため公開する（5432 は core-db が使う）。衝突する場合は STUDIO_DB_PORT で変更する
    ports:
      - ${STUDIO_DB_PORT:-5433}:5432
    environment:
      POSTGRES_USER: studio_user
      POSTGRES_PASSWORD: studio_password
      POSTGRES_DB: studio
    # 名前付きのボリュームにし、make down で消さない。名前の無いボリュームだと down のたびに空になり、seed が作り直す
    # オペレーターの ID（JWT の sub）が変わって、core の DB に残った紐づけと合わなくなる（studio#19）
    volumes:
      - studio-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio_user -d studio"]
      interval: 2s
      timeout: 5s
      retries: 30

  # 開発環境の入口。他プロジェクトと衝突する場合は STUDIO_PORT で変更する
  studio-envoy:
    image: envoyproxy/envoy:v1.40.2
    ports:
      - ${STUDIO_PORT:-3001}:10000
    volumes:
      - ./local/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    depends_on:
      - studio
    # /studio/graphql を core:3333 に転送し、core から studio（JWKS 等）にもここを通って届くよう、共有ネットワークにも参加する
    networks:
      - default
      - diecardomain-studio
    # イメージに curl が無いため bash の /dev/tcp で admin の /ready を確認する（HTTP/1.0 は 426 になる）
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/localhost/9901 && printf 'GET /ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q LIVE <&3",
        ]
      start_period: 30s
      start_interval: 1s
      interval: 10s
      timeout: 5s
      retries: 3

  # オプション: Cloudflare Quick Tunnel で外部（スマホ等）からアクセスする。make tunnel で起動
  studio-tunnel:
    image: cloudflare/cloudflared:2026.10.7
    profiles: ["tunnel"]
    command: ["tunnel", "--no-autoupdate", "--url", "http://studio-envoy:10000"]
    depends_on:
      studio-envoy:
        condition: service_healthy

  # ブラウザ入りの公式イメージ。@playwright/test とバージョンを一致させる
  studio-playwright:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    init: true
    user: pwuser
    working_dir: /home/pwuser
    # Playwright は studio の node_modules（package.json の @playwright/test）のものを使う。npx で起動のたびに npm から
    # 取ってくると、npm に届かないときにサーバーが立たず、版も package.json と二重に書くことになるため（studio#25）。
    # node_modules/.bin/playwright は pnpm がホストのパスを書いたスクリプトなので使わず、cli.js を node で起動する
    volumes:
      - ./node_modules:/home/pwuser/node_modules:ro
    command:
      [
        "node",
        "node_modules/@playwright/test/cli.js",
        "run-server",
        "--port",
        "3000",
        "--host",
        "0.0.0.0",
      ]
    # make up (--wait) で、サーバーが接続を受け付けるまで待つ
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('net').connect(3000,'localhost').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))",
        ]
      start_period: 120s
      start_interval: 1s
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  node-cache:
  studio-db-data:

# core と共有する studio 用のネットワーク（core の make up で作成される）。studio 側は studio-envoy だけが参加する。
# game 用のネットワーク（diecardomain-game）とは分け、game から studio に内部から届く経路を無くす（studio#30・core#45）
networks:
  diecardomain-studio:
    external: true
