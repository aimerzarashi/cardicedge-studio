"""
カード（Creature・Item・Spell）。種類は __typename で見分け、種類ごとの項目は断片（... on Creature 等）で取る
"""
interface Card {
	"""
	公開用の ID
	"""
	id: UUID!
	"""
	カード名
	"""
	name: String!
	"""
	状態（準備中・公開中・使用不可）
	"""
	status: CardStatus!
	"""
	更新の番号（画面が見ていた版。公開する・使用不可にする操作の入力にそのまま渡す。利用者には見せない）
	"""
	revision: Int!
	"""
	登録した日時
	"""
	registeredAt: DateTime!
	"""
	最後に変更した日時（変更していなければ登録した日時）
	"""
	updatedAt: DateTime!
}
"""
カードの一覧の 1 ページ（種類の順（Creature → Item → Spell）、同じ種類の中は名前の順）
"""
type CardConnection {
	"""
	このページのカード
	"""
	edges: [CardEdge!]!
	"""
	ページの情報
	"""
	pageInfo: PageInfo!
}
"""
カードの一覧の 1 件と、その位置
"""
type CardEdge {
	"""
	この 1 件の位置（次のページを取るときに after に渡す）
	"""
	cursor: String!
	"""
	カード
	"""
	node: Card!
}
"""
カードの一覧の絞り込み
"""
input CardFilter {
	"""
	名前に含まれる文字（前後の空白を除き、全角・半角、大文字・小文字の違いは無視する。空・空白だけは入力の誤り。50 文字まで）
	"""
	nameContains: String
	"""
	種類（指定が無ければすべて。空のリストは入力の誤り）
	"""
	types: [CardType!]
	"""
	状態（指定が無ければすべて。空のリストは入力の誤り）
	"""
	statuses: [CardStatus!]
}
"""
カード名が、ほかのカード（Creature・Item・Spell のどれか）ですでに使われている。前後の空白を除き、全角・半角の英数字などを同じ文字とみなして比べる
"""
type CardNameAlreadyInUseError {
	"""
	開発者向けの説明（画面にそのまま出す文言ではない）
	"""
	message: String!
}
"""
カードが無い（公開用の ID に当たるカードが無い。カードでない ID を含む）
"""
type CardNotFoundError {
	"""
	開発者向けの説明（画面にそのまま出す文言ではない）
	"""
	message: String!
}
"""
カードの状態。準備中は自由に変えられ、デッキに入れられず、game に写さない。公開中はデッキに入れられ、game に写す。
使用不可は新しくデッキに入れられないが、プレイヤーが持っているので game には写す
"""
enum CardStatus {
	"""
	準備中（登録したときの状態）
	"""
	DRAFT
	"""
	公開中
	"""
	PUBLISHED
	"""
	使用不可
	"""
	RETIRED
}
"""
カードの種類（一覧の絞り込みに使う）
"""
enum CardType {
	CREATURE
	ITEM
	SPELL
}
"""
カードの一覧の結果
"""
union CardsResult = CardConnection | ValidationErrors | ForbiddenError
"""
クリーチャー（カードの種類の 1 つ）
"""
type Creature implements Card {
	"""
	公開用の ID
	"""
	id: UUID!
	"""
	カード名（登録したときの表記。前後の空白は除く）
	"""
	name: String!
	"""
	状態（準備中・公開中・使用不可）
	"""
	status: CardStatus!
	"""
	更新の番号（画面が見ていた版。公開する・使用不可にする操作の入力にそのまま渡す。利用者には見せない）
	"""
	revision: Int!
	"""
	登録した日時
	"""
	registeredAt: DateTime!
	"""
	最後に変更した日時（変更していなければ登録した日時）
	"""
	updatedAt: DateTime!
}
"""
日時（RFC 3339 の文字列。例: 2026-10-17T09:00:00Z）
"""
scalar DateTime
"""
デッキに入れたカードと枚数
"""
type DeckCard {
	"""
	カード
	"""
	card: Card!
	"""
	枚数（1〜4）
	"""
	count: Int!
}
"""
変えるカードと、その枚数
"""
input DeckCardCountInput {
	"""
	カード（Creature・Item・Spell）の公開用の ID
	"""
	cardId: UUID!
	"""
	その枚数にする（0〜4。0 にするとデッキから外す）
	"""
	count: Int!
}
"""
プリセットデッキを削除する入力
"""
input DeletePresetDeckInput {
	"""
	プリセットデッキの公開用の ID
	"""
	id: UUID!
	"""
	画面が見ていたプリセットデッキの revision
	"""
	revision: Int!
}
"""
プリセットデッキの削除の結果
"""
union DeletePresetDeckResult = DeletePresetDeckSuccess | PresetDeckNotFoundError | RevisionConflictError | ForbiddenError
"""
プリセットデッキを削除した（名前はほかのプリセットデッキが使えるようになる）
"""
type DeletePresetDeckSuccess {
	"""
	削除したプリセットデッキの公開用の ID
	"""
	id: UUID!
}
"""
スターターデッキを削除する入力
"""
input DeleteStarterDeckInput {
	"""
	スターターデッキの公開用の ID
	"""
	id: UUID!
	"""
	画面が見ていたスターターデッキの revision
	"""
	revision: Int!
}
"""
スターターデッキの削除の結果（準備中のものだけ消せる）
"""
union DeleteStarterDeckResult = DeleteStarterDeckSuccess | StarterDeckNotFoundError | StarterDeckNotDraftError | RevisionConflictError | ForbiddenError
"""
スターターデッキを削除した（名前はほかのスターターデッキが使えるようになる）
"""
type DeleteStarterDeckSuccess {
	"""
	削除したスターターデッキの公開用の ID
	"""
	id: UUID!
}
"""
一覧の中で、同じもの（同じカード等）がすでに出てきた（2 回目に付ける）
"""
type FieldDuplicated implements FieldError {
	"""
	誤りのある入力の項目（一覧の中の位置を含む。例: cards.2.cardId）
	"""
	field: String!
}
"""
入力の項目ごとの誤り。理由は __typename で見分ける
"""
interface FieldError {
	"""
	誤りのある入力の項目（GraphQL の引数・入力の項目名と同じ。入れ子の入力は filter.nameContains、一覧の中は cards.0.cardId のように . でつなぐ）
	"""
	field: String!
}
"""
入力の形が正しくない（メールアドレスとして読めない、ページの位置（カーソル）が読めない等）
"""
type FieldInvalidFormat implements FieldError {
	"""
	誤りのある入力の項目
	"""
	field: String!
}
"""
入力の ID が指すもの（プリセットデッキに入れるカード等）が無い
"""
type FieldNotFound implements FieldError {
	"""
	誤りのある入力の項目
	"""
	field: String!
}
"""
入力が範囲の外
"""
type FieldOutOfRange implements FieldError {
	"""
	誤りのある入力の項目
	"""
	field: String!
	"""
	範囲の下限（この値を含む）
	"""
	min: Int!
	"""
	範囲の上限（この値を含む）
	"""
	max: Int!
}
"""
入力が空（前後の空白だけの場合を含む）
"""
type FieldRequired implements FieldError {
	"""
	誤りのある入力の項目
	"""
	field: String!
}
"""
入力が長すぎる
"""
type FieldTooLong implements FieldError {
	"""
	誤りのある入力の項目
	"""
	field: String!
	"""
	上限の文字数
	"""
	max: Int!
}
"""
合計がちょうど決まった値でない（公開するスターターデッキの枚数の合計等。多すぎるのも足りないのも同じ理由）
"""
type FieldTotalMismatch implements FieldError {
	"""
	誤りのある入力の項目
	"""
	field: String!
	"""
	合計の決まった値
	"""
	required: Int!
}
"""
入力を当てた後の合計（プリセットデッキのカードの枚数の合計等）が上限を超える（入力の値そのものではなく、今の状態と合わせた結果の誤り）
"""
type FieldTotalTooLarge implements FieldError {
	"""
	誤りのある入力の項目（一覧全体の結果のときは一覧の項目名。例: cards）
	"""
	field: String!
	"""
	合計の上限
	"""
	max: Int!
}
"""
入力の ID が指すものが、使えない状態（準備中・使用不可のカード等）。あるが、今の状態では使えない
"""
type FieldUnavailable implements FieldError {
	"""
	誤りのある入力の項目（一覧の中の位置を含む。例: cards.2.cardId）
	"""
	field: String!
}
"""
操作する権限が無い（JWT は正しいが、core のオペレーターとして登録されていない等）
"""
type ForbiddenError {
	"""
	開発者向けの説明（画面にそのまま出す文言ではない）
	"""
	message: String!
}
"""
準備中のカードを使用不可にしようとした（準備中から移れるのは公開中だけ）
"""
type InvalidCardStatusTransitionError {
	"""
	開発者向けの説明（画面にそのまま出す文言ではない）
	"""
	message: String!
}
"""
準備中のスターターデッキを使用不可にしようとした（準備中から移れるのは公開中だけ）
"""
type InvalidStarterDeckStatusTransitionError {
	"""
	開発者向けの説明（画面にそのまま出す文言ではない）
	"""
	message: String!
}
"""
アイテム（カードの種類の 1 つ）
"""
type Item implements Card {
	"""
	公開用の ID
	"""
	id: UUID!
	"""
	カード名（登録したときの表記。前後の空白は除く）
	"""
	name: String!
	"""
	状態（準備中・公開中・使用不可）
	"""
	status: CardStatus!
	"""
	更新の番号（画面が見ていた版。公開する・使用不可にする操作の入力にそのまま渡す。利用者には見せない）
	"""
	revision: Int!
	"""
	登録した日時
	"""
	registeredAt: DateTime!
	"""
	最後に変更した日時（変更していなければ登録した日時）
	"""
	updatedAt: DateTime!
}
type Mutation {
	"""
	カードを公開中にする（紐づいたオペレーターだけ。準備中・使用不可から）
	"""
	publishCard(
		"""
		公開するカード
		"""
		input: PublishCardInput!
	): PublishCardResult!
	"""
	カードを使用不可にする（紐づいたオペレーターだけ。公開中から）
	"""
	retireCard(
		"""
		使用不可にするカード
		"""
		input: RetireCardInput!
	): RetireCardResult!
	"""
	クリーチャーを登録する（紐づいたオペレーターだけ）
	"""
	registerCreature(
		"""
		登録するクリーチャー
		"""
		input: RegisterCreatureInput!
	): RegisterCreatureResult!
	"""
	アイテムを登録する（紐づいたオペレーターだけ）
	"""
	registerItem(
		"""
		登録するアイテム
		"""
		input: RegisterItemInput!
	): RegisterItemResult!
	"""
	プリセットデッキを登録する（紐づいたオペレーターだけ）
	"""
	registerPresetDeck(
		"""
		登録するプリセットデッキ
		"""
		input: RegisterPresetDeckInput!
	): RegisterPresetDeckResult!
	"""
	プリセットデッキの名前を変える（紐づいたオペレーターだけ）
	"""
	renamePresetDeck(
		"""
		変える内容
		"""
		input: RenamePresetDeckInput!
	): RenamePresetDeckResult!
	"""
	プリセットデッキのカードの枚数を変える（紐づいたオペレーターだけ）
	"""
	setPresetDeckCardCounts(
		"""
		変える内容
		"""
		input: SetPresetDeckCardCountsInput!
	): SetPresetDeckCardCountsResult!
	"""
	プリセットデッキを削除する（紐づいたオペレーターだけ）
	"""
	deletePresetDeck(
		"""
		削除するプリセットデッキ
		"""
		input: DeletePresetDeckInput!
	): DeletePresetDeckResult!
	"""
	スペルを登録する（紐づいたオペレーターだけ）
	"""
	registerSpell(
		"""
		登録するスペル
		"""
		input: RegisterSpellInput!
	): RegisterSpellResult!
	"""
	スターターデッキを空から登録する（準備中。紐づいたオペレーターだけ）
	"""
	registerStarterDeck(
		"""
		登録するスターターデッキ
		"""
		input: RegisterStarterDeckInput!
	): RegisterStarterDeckResult!
	"""
	プリセットデッキから写してスターターデッキを登録する（準備中。紐づいたオペレーターだけ）
	"""
	registerStarterDeckFromPresetDeck(
		"""
		写す元
		"""
		input: RegisterStarterDeckFromPresetDeckInput!
	): RegisterStarterDeckFromPresetDeckResult!
	"""
	スターターデッキの名前を変える（準備中のものだけ。紐づいたオペレーターだけ）
	"""
	renameStarterDeck(
		"""
		変える内容
		"""
		input: RenameStarterDeckInput!
	): RenameStarterDeckResult!
	"""
	スターターデッキのカードの枚数を変える（準備中のものだけ。紐づいたオペレーターだけ）
	"""
	setStarterDeckCardCounts(
		"""
		変える内容
		"""
		input: SetStarterDeckCardCountsInput!
	): SetStarterDeckCardCountsResult!
	"""
	スターターデッキを削除する（準備中のものだけ。紐づいたオペレーターだけ）
	"""
	deleteStarterDeck(
		"""
		削除するスターターデッキ
		"""
		input: DeleteStarterDeckInput!
	): DeleteStarterDeckResult!
	"""
	スターターデッキを公開中にする（紐づいたオペレーターだけ）
	"""
	publishStarterDeck(
		"""
		公開するスターターデッキ
		"""
		input: PublishStarterDeckInput!
	): PublishStarterDeckResult!
	"""
	スターターデッキを使用不可にする（紐づいたオペレーターだけ）
	"""
	retireStarterDeck(
		"""
		使用不可にするスターターデッキ
		"""
		input: RetireStarterDeckInput!
	): RetireStarterDeckResult!
}
"""
ページの情報
"""
type PageInfo {
	"""
	次のページがあるか
	"""
	hasNextPage: Boolean!
	"""
	前のページがあるか（after を指定したら true）
	"""
	hasPreviousPage: Boolean!
	"""
	このページの最初の 1 件の位置
	"""
	startCursor: String
	"""
	このページの最後の 1 件の位置（次のページは after にこれを渡す）
	"""
	endCursor: String
}
"""
プリセットデッキ
"""
type PresetDeck {
	"""
	公開用の ID
	"""
	id: UUID!
	"""
	名前（登録・変更したときの表記。前後の空白は除く）
	"""
	name: String!
	"""
	入れたカードと枚数（カードの一覧と同じ並び: 種類の順（Creature → Item → Spell）、同じ種類の中は名前の順）
	"""
	cards: [DeckCard!]!
	"""
	カードの枚数の合計
	"""
	totalCount: Int!
	"""
	更新の番号（画面が見ていた版。変える・消す操作の入力にそのまま渡す。利用者には見せない）
	"""
	revision: Int!
	"""
	登録した日時
	"""
	registeredAt: DateTime!
	"""
	最後に変更した日時（変更していなければ登録した日時）
	"""
	updatedAt: DateTime!
}
"""
プリセットデッキの一覧の 1 ページ（名前の順）
"""
type PresetDeckConnection {
	"""
	このページのプリセットデッキ
	"""
	edges: [PresetDeckEdge!]!
	"""
	ページの情報
	"""
	pageInfo: PageInfo!
}
"""
プリセットデッキの一覧の 1 件と、その位置
"""
type PresetDeckEdge {
	"""
	この 1 件の位置（次のページを取るときに after に渡す）
	"""
	cursor: String!
	"""
	プリセットデッキ
	"""
	node: PresetDeck!
}
"""
プリセットデッキの一覧の絞り込み
"""
input PresetDeckFilter {
	"""
	名前に含まれる文字（前後の空白を除き、全角・半角、大文字・小文字の違いは無視する。空・空白だけは入力の誤り。50 文字まで）
	"""
	nameContains: String
}
"""
名前が、ほかのプリセットデッキですでに使われている。カード名と同じ比べ方（前後の空白を除き、全角・半角、大文字・小文字の違いを同じとみなす）
"""
type PresetDeckNameAlreadyInUseError {
	"""
	開発者向けの説明（画面にそのまま出す文言ではない）
	"""
	message: String!
}
"""
プリセットデッキが無い（削除したものを含む）
"""
type PresetDeckNotFoundError {
	"""
	開発者向けの説明（画面にそのまま出す文言ではない）
	"""
	message: String!
}
"""
プリセットデッキの詳細の結果
"""
union PresetDeckResult = PresetDeck | PresetDeckNotFoundError | ForbiddenError
"""
プリセットデッキの一覧の結果
"""
union PresetDecksResult = PresetDeckConnection | ValidationErrors | ForbiddenError
"""
カードを公開中にする入力
"""
input PublishCardInput {
	"""
	カード（Creature・Item・Spell）の公開用の ID
	"""
	id: UUID!
	"""
	画面が見ていたカードの revision
	"""
	revision: Int!
}
"""
カードを公開中にする操作の結果
"""
union PublishCardResult = PublishCardSuccess | CardNotFoundError | RevisionConflictError | InvalidCardStatusTransitionError | ForbiddenError
"""
カードを公開中にした（すでに公開中なら何も変えず、revision も進まない）
"""
type PublishCardSuccess {
	"""
	公開したカードの公開用の ID
	"""
	id: UUID!
	"""
	公開したカードの revision（内容は返さない。画面はカードを読み直し、その revision を持つ）
	"""
	revision: Int!
}
"""
スターターデッキを公開する入力
"""
input PublishStarterDeckInput {
	"""
	スターターデッキの公開用の ID
	"""
	id: UUID!
	"""
	画面が見ていたスターターデッキの revision
	"""
	revision: Int!
}
"""
スターターデッキの公開の結果（準備中・使用不可から公開中にできる。公開中の数が上限なら公開できない）
"""
union PublishStarterDeckResult = PublishStarterDeckSuccess | ValidationErrors | StarterDeckNotFoundError | StarterDeckLimitReachedError | RevisionConflictError | ForbiddenError
"""
スターターデッキを公開中にした（すでに公開中なら何も変えず、revision も進まない）
"""
type PublishStarterDeckSuccess {
	"""
	公開したスターターデッキの公開用の ID
	"""
	id: UUID!
	"""
	公開したスターターデッキの revision（内容は返さない。画面は詳細を読み直し、詳細の revision を持つ）
	"""
	revision: Int!
}
type Query {
	"""
	カードの一覧（紐づいたオペレーターだけ）
	"""
	cards(
		"""
		絞り込み
		"""
		filter: CardFilter

		"""
		1 ページの件数（1〜100。指定が無ければ 50）
		"""
		first: Int

		"""
		前のページの pageInfo.endCursor（指定が無ければ最初のページ）
		"""
		after: String
	): CardsResult!
	"""
	プリセットデッキの一覧（紐づいたオペレーターだけ）
	"""
	presetDecks(
		"""
		絞り込み
		"""
		filter: PresetDeckFilter

		"""
		1 ページの件数（1〜100。指定が無ければ 50）
		"""
		first: Int

		"""
		前のページの pageInfo.endCursor（指定が無ければ最初のページ）
		"""
		after: String
	): PresetDecksResult!
	"""
	プリセットデッキの詳細（紐づいたオペレーターだけ）
	"""
	presetDeck(
		"""
		プリセットデッキの公開用の ID
		"""
		id: UUID!
	): PresetDeckResult!
	"""
	スターターデッキの一覧（紐づいたオペレーターだけ）
	"""
	starterDecks(
		"""
		絞り込み
		"""
		filter: StarterDeckFilter

		"""
		1 ページの件数（1〜100。指定が無ければ 50）
		"""
		first: Int

		"""
		前のページの pageInfo.endCursor（指定が無ければ最初のページ）
		"""
		after: String
	): StarterDecksResult!
	"""
	スターターデッキの詳細（紐づいたオペレーターだけ）
	"""
	starterDeck(
		"""
		スターターデッキの公開用の ID
		"""
		id: UUID!
	): StarterDeckResult!
}
"""
クリーチャーを登録する入力
"""
input RegisterCreatureInput {
	"""
	カード名（1〜50 文字。前後の空白は除いて保存する）
	"""
	name: String!
}
"""
